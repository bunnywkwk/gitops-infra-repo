# SealedSecret CRD for GitOps (Bitnami Sealed Secrets)
# Safe to commit to public or private Git repositories.
# Only the SealedSecrets controller inside your K8s cluster can decrypt this into 'postgres-secret'.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: default
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: gitops-pipeline
spec:
  encryptedData:
    # Encrypted payload generated via 'kubeseal' CLI
    POSTGRES_PASSWORD: AgA34f89aF...[ENCRYPTED_BY_KUBESEAL_KEY]...==
  template:
    metadata:
      name: postgres-secret
      namespace: default
      labels:
        app.kubernetes.io/name: postgres
    type: Opaque
